# Reference deployment for the OpenClinica CE qualification environment.
#
# This file is an IQ artefact (VQ-006). Before execution:
#  1. Replace the :tag references with DIGEST-PINNED references (image@sha256:...) and
#     record those digests in IQ-04/IQ-05. A mutable tag is NOT acceptable evidence.
#  2. TLS is terminated at the reverse proxy (CFG-002 / IQ-14); OpenClinica CE itself
#     does not provide TLS (see VQ-012 DEV-001).
#  3. init-readonly.sql (mounted below) creates the read-only evidence role at initdb.
#     AFTER first boot, apply post-schema-setup.sql to grant SELECT on the created tables
#     and install the audit-immutability triggers (OQ-15 / IQ-13):
#        docker compose exec -T db psql -U openclinica -d openclinica -f - < post-schema-setup.sql
#  4. Before starting the proxy, generate the self-signed cert into ./certs
#     (see generate-certs.sh). Missing cert/config files would otherwise crash nginx.
#
# Community images (e.g. JensPiegsa/OpenClinica, APSL/docker-openclinica) are explicitly
# "for trying out" per their authors; provenance is a documented risk (VQ-012 DEV-004).

services:
  db:
    # OpenClinica CE 3.13 is tested against PostgreSQL 9.5 (its EOL stack, VQ-002 R-15).
    # TODO(IQ-05): pin -> postgres@sha256:<record-digest-here>
    image: postgres:9.5
    environment:
      POSTGRES_DB: openclinica
      POSTGRES_USER: openclinica       # DB superuser role the app connects as
      POSTGRES_PASSWORD: ${DB_APP_PASSWORD:?set in .env, never default}
    volumes:
      - oc_pgdata:/var/lib/postgresql/data
      - ./init-readonly.sql:/docker-entrypoint-initdb.d/10-readonly.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclinica -d openclinica"]
      interval: 10s
      timeout: 5s
      retries: 12
    # The evidence harness (src/audit-db.ts, admin-db.ts) runs on the HOST and queries
    # the audit trail directly, so the DB port is published to localhost for the
    # qualification environment. In a real deployment this is bound to localhost only /
    # removed and the harness run inside the network (CFG-003).
    ports:
      - "127.0.0.1:5432:5432"
    networks: [internal]

  openclinica:
    # Real, pullable community image (JensPiegsa's Dockerfile, published as piegsaj on Hub).
    # App is served at the /OpenClinica context path; default admin is root / 12345678.
    # TODO(IQ-04): pin -> piegsaj/openclinica@sha256:<record-digest-here>
    image: piegsaj/openclinica:oc-3.13
    depends_on:
      db:
        condition: service_healthy   # wait for Postgres to accept connections
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: openclinica
      DB_USER: openclinica
      DB_PASS: ${DB_APP_PASSWORD:?set in .env}
      TZ: UTC                       # CFG-004 trustworthy timestamps
      LOG_LEVEL: INFO
    volumes:
      - oc_data:/usr/local/tomcat/openclinica.data   # persistent app data (IQ-18)
    # DEBUG/IQ-bring-up ONLY: direct HTTP on 8080 to confirm the app is up at
    # http://localhost:8080/OpenClinica before wiring TLS. Comment this out for the
    # controlled configuration (CFG-003 = no direct exposure); the proxy is the real path.
    ports:
      - "8080:8080"
    networks: [internal]

  proxy:
    # TLS termination (CFG-002). TODO(IQ-06): pin digest.
    image: nginx:1.27
    depends_on: [openclinica]
    ports:
      - "443:443"                   # HTTPS only; no plain HTTP exposed externally
    volumes:
      - ./nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [internal]

volumes:
  oc_pgdata:                        # persistent DB (IQ-18)
  oc_data:                          # persistent app data (IQ-18)

networks:
  internal:
    driver: bridge
