# TLS termination for the OpenClinica CE qualification environment (CFG-002 / IQ-14).
# OpenClinica CE does not serve TLS itself (VQ-012 DEV-001); this proxy provides it and
# no plain-HTTP port is published to the host.

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # OpenClinica listens on 8080 inside the container. If your image serves under a
    # context path (e.g. /OpenClinica), the app will redirect there after proxying.
    location / {
        proxy_pass         http://openclinica:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_redirect     http:// https://;
    }
}
